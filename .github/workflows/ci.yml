name: CampusPulse CI/CD Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Next.js Production Build
      run: npm run build
      env:
        NODE_ENV: production
        NEXTAUTH_SECRET: campus_pulse_ci_secret_key_2026
        NEXTAUTH_URL: http://localhost:3000
        MONGODB_URI: mongodb+srv://demo:demo@cluster.mongodb.net/campuspulse
