version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuspulse-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  uploads_data:
    driver: local
