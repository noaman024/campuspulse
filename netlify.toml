# Netlify configuration for CampusPulse Next.js Application
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Optional security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
